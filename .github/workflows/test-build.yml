# A test build of this branch for Windows (x64) and macOS (Apple silicon and Intel in one .dmg),
# without the official signatures: run it from the Actions tab (Run workflow), or push to a branch
# named test-*. Once both build, a pre-release test-YYYYMMDD-N gets the two files
# (vi-translator-windows-x64.exe, VI-Translator-macos.dmg); they're also the run's artifacts.
name: Test build

on:
  workflow_dispatch:
  push:
    branches: ["test-*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # (macOS on Intel: Apple silicon runners are often not to be had; the app is built universal
          # either way, and its tests run on this runner's own architecture)
          - { os: windows, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos,   runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # a test build: no update check (src-tauri/src/updater.rs TEST_BUILD)
      VIT_TEST_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Real GTA VI frames (CouchSubs' regression set, AGPL-3.0 project; gameplay screenshots, not kept
      # in this repository): fetched at a pinned commit for the phone and screen tests.
      - name: Real frames (CouchSubs testdata, pinned)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/yorulmazsinan/couchsubs "$RUNNER_TEMP/couchsubs"
          cd "$RUNNER_TEMP/couchsubs"
          git sparse-checkout set testdata/frames
          git checkout bc54ff70256812747189421ee9bde3aea33ba5bf
          echo "VIT_FRAMES=$RUNNER_TEMP/couchsubs/testdata/frames" >> "$GITHUB_ENV"
          ls testdata/frames | wc -l

      - name: Test
        run: |
          cargo test --target ${{ matrix.target }}
          # (the real-frame test must have run, not skipped)
          cargo test --release --target ${{ matrix.target }} -p vi-translator-core --test phone_frames -- --nocapture 2>&1 | tee phone-frames.txt
          grep -q "test result: ok" phone-frames.txt && ! grep -q "skipped" phone-frames.txt
          # (the anchor on a shaken, turning 30 s clip made from the real phone frames)
          cargo test --release --target ${{ matrix.target }} -p vi-translator-core --test phone_stress -- --nocapture 2>&1 | tee phone-stress.txt
          grep -q "frames tracked" phone-stress.txt
          # (the computer's own video decoder against OpenH264 on a 1080p clip made in the test)
          mkdir -p video-bench
          VIT_BENCH_OUT="$PWD/video-bench/video-bench-${{ matrix.os }}.md" cargo test --release --target ${{ matrix.target }} -p vi-translator-ps --test video_decode -- --nocapture 2>&1 | tee video-bench/video-decode-${{ matrix.os }}.txt
          grep -q "test result: ok" video-bench/video-decode-${{ matrix.os }}.txt

      - name: Build (Windows)
        if: matrix.os == 'windows'
        working-directory: src-tauri
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../out
          cp "../target/${{ matrix.target }}/release/vi-translator.exe" ../out/vi-translator-windows-x64.exe

      # Apple's on-device translation helper (src-tauri/apple): built with a macOS 26 SDK when the runner has
      # one, else a stand-in that says so (the app then offers no Apple engine). Bundled in the .app's MacOS.
      - name: Apple translation helper (macOS)
        if: matrix.os == 'macos'
        working-directory: src-tauri/apple
        run: |
          mkdir -p build
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          echo "SDK: $(xcrun --show-sdk-version)"
          if swiftc -O -parse-as-library -target arm64-apple-macos11 vit-apple-translate.swift -o build/arm64 \
             && swiftc -O -parse-as-library -target x86_64-apple-macos11 vit-apple-translate.swift -o build/x86_64; then
            lipo -create build/arm64 build/x86_64 -output build/vit-apple-translate
            echo "built with Apple's Translation framework"
          else
            cp stub.sh build/vit-apple-translate
            echo "::warning::no macOS 26 SDK on this runner: the Apple engine is a stand-in in this build"
          fi
          chmod +x build/vit-apple-translate
          codesign -s - -f build/vit-apple-translate || true
          echo "status on this runner: $(build/vit-apple-translate --status en ar || echo failed)"

      - name: Build (macOS .dmg)
        if: matrix.os == 'macos'
        working-directory: src-tauri
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          npx --yes @tauri-apps/cli@2.12.5 build --target universal-apple-darwin
          mkdir -p ../out
          cp ../target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/VI-Translator-macos.dmg

      # An Intel Mac's build has no offline translator (no ONNX Runtime for Intel Macs): there the tests that
      # draw translations use a stand-in translator (tools/mock_translator.py, Arabic for every line) — the
      # drawing is what they check. On Apple silicon the app's own offline translator is used.
      - name: Stand-in translator (Intel Mac)
        if: matrix.os == 'macos'
        run: |
          if [ "$(uname -m)" = x86_64 ]; then
            nohup python3 tools/mock_translator.py 5000 > /dev/null 2>&1 &
            sleep 1
            echo "VIT_PROBE_ENGINE=libre" >> "$GITHUB_ENV"
            echo "VIT_PROBE_LIBRE=http://127.0.0.1:5000" >> "$GITHUB_ENV"
            echo "VIT_SNAP_SERVICE=libre" >> "$GITHUB_ENV"
            echo "stand-in translator on :5000"
          fi

      # The app's own reading (Apple Vision, the offline translator) on CouchSubs' real GTA VI phone frames,
      # drawn by the app's own code in headless Chrome, and checked (tools/phone_render.py): every message's
      # Arabic inside its own bubble on the game's phone, one text size, turned as the phone is, no English
      # left in a translated bubble. The renders are an artifact.
      - name: Phone renders (macOS)
        if: matrix.os == 'macos'
        run: |
          APP=target/universal-apple-darwin/release/vi-translator
          F="$VIT_FRAMES"
          mkdir -p phone-renders
          "$APP" --probe-phone phone-renders/probe.json "$F/gta6-telefon-sohbet-1.jpg" "$F/gta6-telefon-sohbet-2.jpg" "$F/gta6-telefon-ana-1.jpg" "$F/gta6-telefon-ana-2.jpg" "$F/gta6-n4-bildirim.jpg"
          python3 -m pip install --quiet --break-system-packages playwright==1.63.0 || python3 -m pip install --quiet playwright==1.63.0
          python3 tools/phone_render.py phone-renders/probe.json ui phone-renders --app "$APP"

      # GTA VI's screen-fixed UI (mission menus, the map and its card, GPS and mission lines) through the app's
      # snapshot on CouchSubs' frames, drawn by ui/snapshot.js: before/after PNGs and which blocks were translated.
      - name: UI renders (macOS)
        if: matrix.os == 'macos'
        run: |
          python3 tools/ui_render.py target/universal-apple-darwin/release/vi-translator "$VIT_FRAMES" ui ui-renders ${VIT_SNAP_SERVICE:+--service $VIT_SNAP_SERVICE}
          cat ui-renders/ui-renders.md

      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'macos'
        with:
          name: ui-renders
          path: ui-renders/*
          if-no-files-found: warn

      # The subtitle reader (the host's OCR: Vision here, Windows OCR there) on CouchSubs' GTA VI subtitle
      # frames against their ground truth: word accuracy and every miss, in the video-bench artifact.
      - name: Subtitle accuracy
        run: |
          if [ "${{ matrix.os }}" = windows ]; then APP="target/${{ matrix.target }}/release/vi-translator.exe"; PY=python; else APP=target/universal-apple-darwin/release/vi-translator; PY=python3; fi
          mkdir -p video-bench
          $PY tools/subtitle_accuracy.py "$APP" "$VIT_FRAMES" "video-bench/subtitle-accuracy-${{ matrix.os }}.md"
          cat "video-bench/subtitle-accuracy-${{ matrix.os }}.md"

      # The PS5 picture drawn by the app's own page at a steady 60 frames a second (Smooth, Lowest delay; with
      # the in-place phone layer and the picture panel). The Mac runner has a GPU and gates on it; the Windows
      # runner has none (WARP), so there the numbers are reported, not gated.
      - name: Smoothness
        continue-on-error: ${{ matrix.os == 'windows' }}
        run: |
          if [ "${{ matrix.os }}" = windows ]; then PY=python; else PY=python3; fi
          $PY -m pip install --quiet playwright==1.63.0 || true
          mkdir -p video-bench
          $PY tools/smoothness.py ui "video-bench/smoothness-${{ matrix.os }}.md" --seconds 60 --size 1920x1080

      # 30 minutes of the phone and subtitle frames through the engine: memory, the reading's time, no panic.
      - name: Soak (30 min)
        run: |
          if [ "${{ matrix.os }}" = windows ]; then APP="target/${{ matrix.target }}/release/vi-translator.exe"; else APP=target/universal-apple-darwin/release/vi-translator; fi
          F="$VIT_FRAMES"
          mkdir -p video-bench
          "$APP" --soak 30 "video-bench/soak-${{ matrix.os }}.md" "$F/gta6-telefon-sohbet-1.jpg" "$F/gta6-01-lucia.jpg" "$F/gta6-telefon-ana-1.jpg" "$F/gta6-14-iki-satir.jpg" "$F/gta6-telefon-sohbet-2.jpg" "$F/gta6-20-gorev.jpg" 2>&1 | tee video-bench/soak-${{ matrix.os }}.log | grep -E "^- |\[soak\] pass [0-9]*0:" || true
          ! grep -q "panicked" video-bench/soak-${{ matrix.os }}.log
          cat "video-bench/soak-${{ matrix.os }}.md" | head -12
          grep -q "pass$" <(grep "^- Memory" "video-bench/soak-${{ matrix.os }}.md") && grep -q "pass$" <(grep "^- Reading" "video-bench/soak-${{ matrix.os }}.md")

      # A window that changes 60 times a second, captured as the app captures (ScreenCaptureKit, then the
      # old CoreGraphics way to compare). Needs the runner to allow screen recording: if it doesn't,
      # that's what the result says.
      - name: Window capture (macOS)
        if: matrix.os == 'macos'
        run: |
          APP=target/universal-apple-darwin/release/vi-translator
          mkdir -p video-bench
          osascript -l JavaScript tools/test_window.js &
          sleep 6
          SCK=$("$APP" --capture-window "VIT capture test" 10 video-bench/capture-sck.png 2>&1 | tail -1 || true)
          CG=$(VIT_CAPTURE=cg "$APP" --capture-window "VIT capture test" 10 video-bench/capture-cg.png 2>&1 | tail -1 || true)
          kill %1 || true
          printf 'ScreenCaptureKit: %s\nCoreGraphics: %s\n' "$SCK" "$CG" | tee video-bench/window-capture.txt
          # (no Screen Recording permission on the runner: nothing to measure, said so; else 120 frames at
          # 55 a second or more with no wait over 50 ms)
          if echo "$SCK" | grep -q "Screen Recording"; then echo "skipped: the runner doesn't allow screen recording" | tee -a video-bench/window-capture.txt; exit 0; fi
          python3 - "$SCK" <<'PY'
          import re, sys
          line = sys.argv[1]
          m = re.search(r"first 120: ([0-9.]+) a second, longest gap (\d+) ms", line)
          assert m, line
          fps, gap = float(m.group(1)), int(m.group(2))
          assert fps >= 55 and gap <= 50, f"ScreenCaptureKit: {fps} a second, longest gap {gap} ms"
          print("ok", fps, gap)
          PY

      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'macos'
        with:
          name: phone-renders
          path: phone-renders/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-bench-${{ matrix.os }}
          path: video-bench/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: vi-translator-${{ matrix.os }}-test
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Release with the two files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # (a release of its own, not the developer's update channel: the build doesn't update itself,
          # so an update from the original app never replaces Barqawi; the tag isn't vX.Y.Z, so the
          # signed-release workflow doesn't start)
          TAG="barqawi-$V-${{ github.run_number }}"
          # (the test reports and the renders, for whoever checks the build)
          (cd out && zip -q -r ../test-reports.zip . -x 'vi-translator-windows-x64.exe' 'VI-Translator-macos.dmg')
          gh release create "$TAG" out/vi-translator-windows-x64.exe out/VI-Translator-macos.dmg test-reports.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Barqawi $V" \
            --notes "Barqawi $V from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): every test passed on macOS and Windows (reports in test-reports.zip). Not signed with the original app's update key; it doesn't update itself."
