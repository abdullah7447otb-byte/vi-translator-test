[package]
name = "vi-translator-core"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"
description = "VI Translator's reading and translating (OCR post-processing, translation memory, game pages, TV protocol), for the desktop and phone apps"

[features]
default = []
# the free offline translator (OPUS-MT on ONNX Runtime): the desktop app has it, the phone apps leave it out
offline = ["dep:ort", "dep:tokenizers"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = "2"
flate2 = "1"
# this device's network addresses (finding TVs on every home network it is on)
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ort = { version = "2.0.0-rc.15", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
uuid = { version = "1", features = ["v4"] }

# QuickJS ships no ready-made bindings for Android and iOS: made at build time there (needs
# libclang: LIBCLANG_PATH; see README.md)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14.0", features = ["bindgen"] }

# Android: HTTPS checked against Mozilla's root certificates (the system's verifier needs a JNI
# setup a UniFFI library can't do)
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.12"
