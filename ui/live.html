<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120a26" />
    <title>Barqawi · Live</title>
    <link rel="stylesheet" href="fonts.css" />
    <!-- on an iPad's or phone's home screen: Share › Add to Home Screen opens it full screen, like an app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Barqawi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      :root { --bg: #0f0b1d; --panel: #1a1431; --text: #f4f1ff; --muted: #a59cc7; --accent: #ffcf5a; --size: 26px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: "Tajawal", "Segoe UI", "Noto Sans", system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel);
        position: sticky; top: 0; border-bottom: 1px solid #2c2450; }
      header b { font-size: 16px; flex: 1; }
      header select { background: #2a2147; color: var(--text); border: 1px solid #3a3063; border-radius: 10px; height: 38px;
        padding: 0 6px; font-size: 14px; max-width: 9.5em; }
      .ctl { padding: 10px 14px 4px; background: var(--panel); border-bottom: 1px solid #3a3063;
        font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; }
      .ctl h4 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      .ctl label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; cursor: pointer; }
      .ctl input { width: 20px; height: 20px; accent-color: var(--accent); }
      .ctl .err { color: #ff8a8a; font-size: 13px; padding: 4px 0; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #d33; }
      .dot.on { background: #3c6; }
      button { background: #2a2147; color: var(--text); border: 1px solid #3a3063; border-radius: 10px;
        min-width: 44px; height: 38px; font-size: 16px; cursor: pointer; }
      button.on { border-color: var(--accent); color: var(--accent); }
      main { flex: 1; overflow-y: auto; padding: 12px 14px 40px; }
      .line { padding: 10px 0; border-bottom: 1px solid #241c40; }
      .meta { display: flex; gap: 8px; align-items: baseline; }
      .when { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
      .en { font-size: 13px; color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; }
      .text { font-size: var(--size); line-height: 1.45; margin-top: 2px; unicode-bidi: plaintext; text-align: start; }
      body.no-en .en { display: none; }
      .empty { color: var(--muted); text-align: center; margin-top: 30vh; font-size: 16px; }
      /* "Live translations" switched off in the app */
      .paused { padding: 10px 14px; background: #2a2147; color: var(--accent); font-size: 14px; text-align: center;
        border-bottom: 1px solid #3a3063; font-family: "Segoe UI", system-ui, sans-serif; }
      .paused[hidden] { display: none; }
      header .grow { flex: 1; }
      .line.corrected .text::after { content: " ✓"; color: var(--accent); font-size: .6em; }
      body.can-fix .line { cursor: pointer; }
      /* the current line alone, big and centred, like film subtitles */
      body.big main { display: flex; flex-direction: column; justify-content: center; }
      body.big .line { display: none; border: 0; text-align: center; }
      body.big .line.current { display: block; }
      body.big .line.current .text { font-size: calc(var(--size) * 1.8); text-align: center; }
      body.big .line.current .meta { justify-content: center; }
      body.big .empty { margin-top: 0; }
      .line.hide { display: none !important; }
      #fixer { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; z-index: 9; }
      #fixer[hidden] { display: none; }
      #fixer .box { background: var(--panel); border-radius: 14px; padding: 14px; width: min(560px, 100%); display: grid; gap: 10px; }
      #fixer textarea { width: 100%; min-height: 90px; font: inherit; font-size: 20px; background: #2a2147; color: var(--text);
        border: 1px solid #3a3063; border-radius: 10px; padding: 8px; unicode-bidi: plaintext; }
      #fixer .row { display: flex; gap: 8px; justify-content: flex-end; }
      /* the game phone's chat, as it is on the phone now (its messages in Arabic, the player's own on the right) */
      #chat { background: #17112b; border-bottom: 1px solid #2c2450; padding: 8px 12px 10px; max-height: 55vh; overflow-y: auto; }
      #chat[hidden] { display: none; }
      #chat .ttl { text-align: center; font-weight: 700; color: var(--accent); font-size: 15px; padding: 2px 0 8px; }
      #chat .msgs { display: flex; flex-direction: column; gap: 6px; direction: ltr; }
      #chat .b { max-width: 82%; padding: 7px 11px; border-radius: 16px; font-size: calc(var(--size) * .8); line-height: 1.4;
        background: #2a2147; color: var(--text); align-self: flex-start; unicode-bidi: plaintext; text-align: start; direction: rtl; }
      #chat .b.me { align-self: flex-end; background: #3a6df0; color: #fff; }
      #chat .b.pending { opacity: .6; }
      #chat .b .who { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
      #chat .b.me .who { color: #dfe7ff; }
      #chat .div { align-self: center; color: #8fa6ff; font-size: 13px; padding: 2px 10px; direction: rtl; }
      #chat .b img.em { height: 1.15em; width: auto; vertical-align: -0.2em; margin: 0 0.1em; }
      #speech { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 14px; background: var(--panel);
        border-bottom: 1px solid #2c2450; font-size: 14px; color: var(--muted); }
      #speech[hidden] { display: none; }
      #speech input[type=range] { width: 120px; accent-color: var(--accent); }
      #speech input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
      #chat .row { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-bottom: 1px solid #241c40; direction: rtl; }
      #chat .row img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
      #chat .row .t { font-size: calc(var(--size) * .75); unicode-bidi: plaintext; }
      /* a phone's width: the buttons wrap onto a second row and get smaller */
      @media (max-width: 500px) {
        header { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
        header b { font-size: 15px; }
        button { min-width: 38px; height: 34px; font-size: 15px; }
        header select { height: 34px; font-size: 13px; max-width: 8em; }
        main { padding: 10px 10px 40px; }
        #chat .b { max-width: 90%; }
      }
      #nosleep { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <b>Barqawi</b>
      <button id="snap" title="Translate the whole picture" data-i18n-title hidden>📷</button>
      <button id="ctl" title="Switches" data-i18n-title hidden>⚙</button>
      <select id="filter" title="Show" data-i18n-title aria-label="Show">
        <option value="all" data-i18n>Everything</option>
        <option value="dialogue" data-i18n>Dialogue</option>
        <option value="other" data-i18n>Instructions</option>
      </select>
      <button id="phone" class="on" title="The game phone's chat" data-i18n-title>📱</button>
      <button id="speak" title="Read the new lines aloud" data-i18n-title>🔊</button>
      <button id="big" title="The current line, big" data-i18n-title>⛶</button>
      <button id="awake" title="Keep the screen on" data-i18n-title>🔆</button>
      <button id="save" title="Save this session" data-i18n-title>💾</button>
      <button id="en" class="on" title="Show the English" data-i18n-title>EN</button>
      <button id="smaller" title="Smaller text" data-i18n-title>A−</button>
      <button id="bigger" title="Bigger text" data-i18n-title>A+</button>
      <select id="ui" title="Language" data-i18n-title aria-label="Language"></select>
    </header>
    <!-- the app's switches, when it allows changes from this page -->
    <div class="ctl" id="ctl-panel" hidden></div>
    <div class="paused" id="paused" hidden data-i18n>Paused: Live translations are switched off in VI Translator.</div>
    <div id="speech" hidden>
      <label><span data-i18n>Speed</span> <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1" /> <b id="rate-v">1.0×</b></label>
      <label><input type="checkbox" id="names" checked /> <span data-i18n>Read the speakers' names</span></label>
    </div>
    <section id="chat" hidden></section>
    <main id="list"><div class="empty" id="empty" data-i18n>Waiting for translations…</div></main>
    <!-- a line corrected here: into the app's translation memory as the player's own -->
    <div id="fixer" hidden><div class="box">
      <div class="en" id="fix-en"></div>
      <textarea id="fix-ar" dir="auto"></textarea>
      <div class="err" id="fix-err" hidden></div>
      <div class="row"><button id="fix-cancel" data-i18n>Cancel</button><button id="fix-ok" class="on" data-i18n>Save the correction</button></div>
    </div></div>

    <script src="i18n.js"></script>
    <script src="snapshot.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      // The page's own words in the app's interface language (its dictionary comes from the app).
      const t = (en, vars) => I18N.t(en, vars);
      let uiLang = "en";
      // this device's language among the app's (es-AR → es-MX, zh-TW → zh-Hant …), or null
      function deviceLang() {
        const codes = I18N.UI_LANGS.map((l) => l.code);
        for (const raw of navigator.languages || [navigator.language || ""]) {
          const l = String(raw), base = l.split("-")[0].toLowerCase();
          if (codes.includes(l)) return l;
          if (base === "zh") return /TW|HK|MO|Hant/i.test(l) ? "zh-Hant" : "zh-Hans";
          if (base === "es") return /ES$/i.test(l) ? "es-ES" : "es-MX";
          if (base === "pt") return "pt-BR";
          if (base === "tl") return "fil";
          if (codes.includes(base)) return base;
        }
        return null;
      }
      const uiSel = $("ui");
      for (const l of I18N.UI_LANGS) uiSel.add(new Option(l.name, l.code));
      uiSel.onchange = () => { store("ui", uiSel.value); useUiLang(uiSel.value); };
      function useUiLang(code) {
        uiLang = code;
        uiSel.value = code;
        const done = () => {
          I18N.setLang(code);
          document.title = "VI Translator · " + t("Live translations");
          control = null; // (the switches drawn again in the language)
          if (lastControl) showControls(lastControl);
        };
        if (code === "en") return done();
        const sc = document.createElement("script");
        sc.src = `i18n/${encodeURIComponent(code)}.js`;
        sc.onload = done;
        document.head.appendChild(sc);
      }
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return null; };
      let size = Number(store("size")) || 26;
      const applySize = () => document.documentElement.style.setProperty("--size", `${size}px`);
      applySize();
      $("smaller").onclick = () => { size = Math.max(14, size - 3); applySize(); store("size", size); };
      $("bigger").onclick = () => { size = Math.min(64, size + 3); applySize(); store("size", size); };
      const setEn = (on) => { document.body.classList.toggle("no-en", !on); $("en").classList.toggle("on", on); store("en", on ? "1" : "0"); };
      setEn(store("en") !== "0");
      $("en").onclick = () => setEn(document.body.classList.contains("no-en"));

      // A line's segments [[text, color|null], ...] as HTML: "icon:<height>|<png>" is the game's own
      // button icon, sized to the text like a letter (as on the PC); only PNG data URLs are drawn.
      const segs = (list) => list.map(([text, c]) => {
        if (text === "\n" && !c) return "<br>"; // two speakers' lines, each on its own
        if (c === "dim") return `<span style="opacity:.6">${esc(text)}</span>`; // the other speaker, in grey
        // a speaker name ("Dobbs:") in the game's color for it
        if (c && /^name:#[0-9a-f]{6}$/i.test(c)) return `<span style="color:${c.slice(5)}">${esc(text)}</span>`;
        if (!(c && c.startsWith("icon:"))) return esc(text);
        let src = c.slice(5);
        let h = 1.2;
        const bar = src.indexOf("|");
        if (bar > 0 && !src.startsWith("data:")) {
          const rel = parseFloat(src.slice(0, bar));
          if (rel > 0) h = Math.min(Math.max(rel / 1.2, 0.4), 1.6);
          src = src.slice(bar + 1);
        }
        if (!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(src)) return "🎮";
        return `<img src="${src}" alt="🎮" style="height:${h.toFixed(3)}em;width:auto;vertical-align:${(0.35 - h / 2).toFixed(3)}em;margin:0 0.15em">`;
      }).join("");

      let last = 0;
      let run = null;
      let seenAny = false;
      // the phone chat's version the page has (0: none)
      let ph = 0;
      let chatOn = store("chat") !== "0";
      let chatNow = null;
      const showChat = (c) => {
        chatNow = c;
        const box = $("chat");
        if (!c || !c.items || !c.items.length || !chatOn) { box.hidden = true; return; }
        const rtl = document.documentElement.lang === "ar";
        let html = c.title ? `<div class="ttl" dir="auto">${esc(c.title)}</div>` : "";
        if (c.list) {
          html += c.items.map((m) => `<div class="row">${m.avatar && /^data:image\/png;base64,/.test(m.avatar) ? `<img src="${m.avatar}" alt="">` : ""}<div class="t">${m.name ? `<b>${esc(m.name)}</b><br>` : ""}${esc(m.ar)}</div></div>`).join("");
        } else {
          const ems = (m) => (m.emoji || []).filter((e) => /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(e)).map((e) => `<img class="em" src="${e}" alt="">`).join("");
          html += `<div class="msgs">` + c.items.map((m) => m.divider ? `<div class="div">${esc(m.ar)}</div>` : `<div class="b${m.me ? " me" : ""}${m.pending ? " pending" : ""}">${m.name ? `<span class="who">${esc(m.name)}</span>` : ""}${esc(m.ar)}${ems(m)}</div>`).join("") + `</div>`;
        }
        box.innerHTML = html;
        box.hidden = false;
        box.dir = rtl ? "rtl" : "ltr";
        box.scrollTop = box.scrollHeight;
      };
      const setChat = (on) => { chatOn = on; $("phone").classList.toggle("on", on); store("chat", on ? "1" : "0"); showChat(chatNow); };
      setChat(chatOn);
      $("phone").onclick = () => setChat(!chatOn);
      // read aloud (the device's own Arabic voice): iOS lets a page speak only after a tap, so the
      // button's tap starts it with a word of silence
      let speakOn = false;
      let rate = Number(store("rate")) || 1;
      let names = store("names") !== "0";
      $("rate").value = String(rate);
      $("rate-v").textContent = `${rate.toFixed(1)}×`;
      $("rate").oninput = () => { rate = Number($("rate").value); $("rate-v").textContent = `${rate.toFixed(1)}×`; store("rate", rate); };
      $("names").checked = names;
      $("names").onchange = () => { names = $("names").checked; store("names", names ? "1" : "0"); };
      const voice = () => (window.speechSynthesis ? speechSynthesis.getVoices() : []).find((v) => /^ar/i.test(v.lang)) || null;
      const say = (text) => {
        if (!speakOn || !window.speechSynthesis || !text) return;
        let clean = String(text).replace(/\s+/g, " ").trim();
        // (the speaker's name before the line, "جيسون: …", left out if so chosen)
        if (!names) clean = clean.replace(/^[^:：\n]{1,24}[:：]\s*/, "");
        if (!clean) return;
        // (behind by more than two lines: the old ones are dropped, so it speaks what's on screen now)
        if (speechSynthesis.pending && speechSynthesis.speaking) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = (voice() && voice().lang) || "ar-SA";
        if (voice()) u.voice = voice();
        u.rate = rate;
        speechSynthesis.speak(u);
      };
      $("speak").onclick = () => {
        if (!window.speechSynthesis) { alert(t("Speech isn't available in this browser.")); return; }
        speakOn = !speakOn;
        $("speak").classList.toggle("on", speakOn);
        $("speech").hidden = !speakOn;
        if (speakOn) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
        else speechSynthesis.cancel();
      };
      // every line of this session (the list keeps the newest 200 on screen), for "Save this session"
      const session = new Map();
      let canFix = false;
      let filter = store("filter") || "all";
      $("filter").value = filter;
      const isDialogue = (area) => area === "subtitles";
      const shows = (area) => filter === "all" || (filter === "dialogue") === isDialogue(area);
      const applyFilter = () => {
        for (const el of $("list").querySelectorAll(".line")) el.classList.toggle("hide", !shows(el.dataset.area));
        markCurrent();
      };
      // the newest line the filter lets through: the one the big view shows
      function markCurrent() {
        const all = [...$("list").querySelectorAll(".line")];
        all.forEach((e) => e.classList.remove("current"));
        const cur = all.reverse().find((e) => !e.classList.contains("hide"));
        if (cur) cur.classList.add("current");
      }
      $("filter").onchange = () => { filter = $("filter").value; store("filter", filter); applyFilter(); };
      const setBig = (on) => { document.body.classList.toggle("big", on); $("big").classList.toggle("on", on); store("big", on ? "1" : "0"); };
      setBig(store("big") === "1");
      $("big").onclick = () => setBig(!document.body.classList.contains("big"));
      // keep the screen on: the video plays only after a tap (iOS asks for one), and again when the
      // page comes back to the front
      let awake = store("awake") === "1";
      const vid = $("nosleep");
      const applyAwake = () => {
        $("awake").classList.toggle("on", awake);
        if (awake) vid.play().catch(() => {}); else vid.pause();
      };
      $("awake").onclick = () => { awake = !awake; store("awake", awake ? "1" : "0"); applyAwake(); };
      document.addEventListener("visibilitychange", () => { if (!document.hidden) applyAwake(); });
      document.addEventListener("click", () => { if (awake && vid.paused) vid.play().catch(() => {}); }, { once: true });
      applyAwake();
      // "Save this session": the whole session's lines as a text file
      $("save").onclick = () => {
        const rows = [...session.values()].sort((a, b) => a.id - b.id).map((l) => {
          const when = l.at ? new Date(l.at).toLocaleTimeString([], { hour12: false }) : "";
          return `${when}\n${l.en}\n${l.text}\n`;
        });
        const blob = new Blob([rows.join("\n")], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `vi-translator_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.txt`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      };
      // a tap on a line (when the app allows changes from this page): correct its translation
      let fixing = null;
      $("list").addEventListener("click", (e) => {
        const el = e.target.closest(".line");
        if (!el || !canFix) return;
        const l = session.get(Number(el.dataset.id));
        if (!l) return;
        fixing = l;
        $("fix-en").textContent = l.en;
        $("fix-ar").value = l.text;
        $("fix-err").hidden = true;
        $("fixer").hidden = false;
        $("fix-ar").focus();
      });
      $("fix-cancel").onclick = () => { $("fixer").hidden = true; fixing = null; };
      $("fix-ok").onclick = async () => {
        if (!fixing) return;
        const ar = $("fix-ar").value.trim();
        if (!ar) return;
        try {
          const r = await fetch("correct", { method: "POST", cache: "no-store", body: JSON.stringify({ id: fixing.id, ar }) });
          if (!r.ok) throw new Error(await r.text());
          // every line of the same English shows the correction
          for (const l of session.values()) if (l.en === fixing.en) { l.text = ar; l.segs = [[ar, null]]; }
          for (const el of $("list").querySelectorAll(".line")) {
            const l = session.get(Number(el.dataset.id));
            if (l && l.en === fixing.en) { el.querySelector(".text").textContent = ar; el.classList.add("corrected"); }
          }
          $("fixer").hidden = true;
          fixing = null;
        } catch (err) {
          $("fix-err").hidden = false;
          $("fix-err").textContent = t("Could not change it: {e}", { e: err.message || err });
        }
      };
      const atBottom = () => { const m = $("list"); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; };
      async function poll() {
        try {
          const r = await fetch(`live.json?after=${last}&wait=1&ph=${ph}`, { cache: "no-store" });
          const d = await r.json();
          // the app started again: its line ids start again too
          if (run !== null && d.run !== run) last = 0;
          run = d.run;
          $("dot").classList.add("on");
          $("paused").hidden = d.live !== false;
          // the page's language: the one picked here, else this device's, else the app's
          const want = store("ui") || deviceLang() || d.ui || "en";
          if (want !== uiLang) useUiLang(want);
          $("snap").hidden = d.snap !== true;
          if (typeof d.ph === "number" && d.ph !== ph) { ph = d.ph; showChat(d.phone || null); }
          showControls(d.control || null);
          canFix = !!d.control;
          document.body.classList.toggle("can-fix", canFix);
          const rtl = !!(d.lang && d.lang.rtl);
          if (d.lang && d.lang.code) document.documentElement.lang = d.lang.code;
          if (d.lines.length) {
            const stick = atBottom();
            $("empty")?.remove();
            const first = !seenAny;
            seenAny = true;
            for (const l of d.lines) {
              // (read aloud: the new lines, not the ones already there when the page opened)
              if (!first && l.id > last && shows(l.area)) say(l.text);
              last = Math.max(last, l.id);
              session.set(l.id, l);
              const el = document.createElement("div");
              el.className = "line" + (l.corrected ? " corrected" : "") + (shows(l.area) ? "" : " hide");
              el.dataset.id = l.id;
              el.dataset.area = l.area || "";
              const t = l.at ? new Date(l.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "";
              el.innerHTML = `<div class="meta"><span class="when">${t}</span><span class="en">${l.en_segs?.length ? segs(l.en_segs) : esc(l.en)}</span></div>
                <div class="text" dir="${rtl ? "rtl" : "ltr"}">${l.segs?.length ? segs(l.segs) : esc(l.text)}</div>`;
              // the same line sent again with the game's colors (same area and start): it replaces the first
              const key = `${l.area}|${l.at}`;
              el.dataset.key = key;
              const old = l.at ? [...$("list").children].reverse().find((e) => e.dataset.key === key) : null;
              if (old) old.replaceWith(el);
              else $("list").appendChild(el);
            }
            while ($("list").children.length > 200) $("list").firstElementChild.remove();
            markCurrent();
            if (stick) $("list").scrollTop = $("list").scrollHeight;
          }
        } catch {
          $("dot").classList.remove("on");
          // (the app isn't reachable: tried again in a moment, not at once)
          setTimeout(poll, 1000);
          return;
        }
        // (the next question at once: the app answers it when the next line is there)
        setTimeout(poll, 0);
      }
      poll();
    </script>
    <script>
      // The app's switches (overlays, live translations, read areas, game pages): shown with ⚙ when the app allows
      // changes from this page; a change goes to the app at once.
      let control = null, ctlBusy = false, lastControl = null;
      $("ctl").onclick = () => { $("ctl-panel").hidden = !$("ctl-panel").hidden; };
      function showControls(c) {
        lastControl = c;
        $("ctl").hidden = !c;
        if (!c) { $("ctl-panel").hidden = true; control = null; return; }
        // (not redrawn while a change is on its way, nor when nothing changed)
        if (ctlBusy || JSON.stringify(c) === JSON.stringify(control)) return;
        control = c;
        const row = (what, id, name, on) =>
          `<label><span>${esc(name)}</span><input type="checkbox" data-what="${what}" data-id="${esc(id)}" ${on ? "checked" : ""}></label>`;
        const pick = (n) => (typeof n === "string" ? n : (n && (n[uiLang] || n.en)) || "");
        let html = "";
        if (c.langs && c.langs.length) {
          html += `<h4>${esc(t("Translate into"))}</h4><label><select data-what="lang" style="width:100%;height:38px;border-radius:10px;background:#2a2147;color:var(--text);border:1px solid #3a3063;font-size:15px">` +
            c.langs.map((l) => `<option value="${esc(l.code)}" ${l.code === c.lang ? "selected" : ""}>${esc(l.native)} — ${esc(l.name)}</option>`).join("") + `</select></label>`;
        }
        html += `<h4>${esc(t("Show"))}</h4>${row("overlays", "", t("Overlays on the game"), c.overlays)}${row("live", "", t("Live translations"), c.live)}`;
        if (c.areas.length) html += `<h4>${esc(t("Read areas"))}</h4>` + c.areas.map((a) => row("area", a.id, t(a.name || a.id), a.on)).join("");
        if (c.pages.length) html += `<h4>${esc(t("Game pages"))}</h4>` + c.pages.map((p) => row("page", p.id, pick(p.name) || p.id, p.on)).join("");
        $("ctl-panel").innerHTML = html + `<div class="err" id="ctl-err" hidden></div>`;
      }
      $("ctl-panel").addEventListener("change", async (e) => {
        const el = e.target.closest("input[data-what], select[data-what]");
        if (!el) return;
        ctlBusy = true;
        const lang = el.tagName === "SELECT";
        try {
          const body = lang ? { what: "lang", id: el.value, on: true } : { what: el.dataset.what, id: el.dataset.id, on: el.checked };
          const r = await fetch("control", { method: "POST", cache: "no-store", body: JSON.stringify(body) });
          if (!r.ok) throw new Error(await r.text());
          ctlBusy = false;
          control = null;
          showControls(await r.json());
        } catch (err) {
          ctlBusy = false;
          if (lang) el.value = control ? control.lang : el.value;
          else el.checked = !el.checked;
          const m = $("ctl-err");
          if (m) { m.hidden = false; m.textContent = t("Could not change it: {e}", { e: err.message || err }); }
        }
      });

      // A snapshot: the whole picture in the game, its text translated in place (made by the app on the PC).
      $("snap").onclick = async () => {
        const b = $("snap");
        if (b.disabled) return;
        b.disabled = true;
        b.textContent = "⏳";
        try {
          const r = await fetch("snapshot", { method: "POST", cache: "no-store" });
          if (!r.ok) throw new Error(await r.text());
          const snap = await r.json();
          await Snap.show(snap, {
            labels: { translated: t("Translated"), original: t("Original"), save: t("Save"), close: t("Close") },
            info: `${snap.blocks.length} · ${(snap.ms / 1000).toFixed(1)} s`,
            actions: {
              save: (canvas, s, translated) => {
                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = `vi-translator_${s.id}_${translated ? s.lang : "original"}.png`;
                a.click();
              },
            },
          });
        } catch (e) {
          alert(t("Could not translate the picture: {e}", { e: e.message || e }));
        } finally {
          b.disabled = false;
          b.textContent = "📷";
        }
      };
    </script>
  </body>
</html>
