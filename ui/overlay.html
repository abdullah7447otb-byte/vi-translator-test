<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>VI Translator overlay</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #wrap { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="box"></div></div>
    <script src="common.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const AREA = window.__AREA__;
      const wrap = document.getElementById("wrap");
      const box = document.getElementById("box");
      let cfg = null;
      let segments = [];
      let lineH = 0; // English line height (fraction of the frame) for size matching
      let textBox = null; // English text block [x, y, w, h] (fractions of the frame)
      let gameBox = null; // the game's own box around it, when found (same units)
      let geom = { placement: "above", client_h: 1080 };
      let cover = null; // the game's text seen here, not translated yet (its black box goes up at once)
      // every area's translation now shown and text seen (translations riding above stacked lines
      // place themselves by the others': AS.ridePlace)
      const shownAll = {}, seenAll = {};
      const probe = document.createElement("div");

      // The "__screen" window covers the whole game and draws profile pages (GTA V "Mission Failed").
      const SCREEN = AREA === "__screen";
      // The "__phone" window covers the whole game and draws the phone's translations beside it.
      const PHONE = AREA === "__phone";
      let phone = null;
      let layout = null;

      function draw() {
        if (!cfg) return;
        if (PHONE) {
          AS.renderPhone(wrap, phone);
          return;
        }
        if (SCREEN) {
          AS.renderScreen(wrap, layout, segments, cfg.profile_opts);
          return;
        }
        const area = cfg.areas.find((a) => a.id === AREA);
        if (!area) return;
        AS.anchor(wrap, area.placement, area);
        // style sizes are for a 1080p window; the overlay window is sized in physical pixels
        const dpr = window.devicePixelRatio;
        const k = geom.client_h / 1080 / dpr;
        const W = (geom.client_w || 0) / dpr, H = geom.client_h / dpr;
        // (the profile's look: over the game's lines on a black box, or the area's own placement)
        const ev = { segments, text_box: textBox, game_box: gameBox, line_h: lineH };
        const ox = (geom.win_x || 0) / dpr, oy = (geom.win_y || 0) / dpr;
        // (the window covers the whole picture for these: config "full" in overlay.rs)
        const fx = AS.fxOf(cfg.fx_view || cfg.area_fx, AREA);
        const whole = !!W && (AS.coverLook(cfg.profile_opts) || fx.ride);
        if (!probe.parentNode) wrap.appendChild(probe);
        const ride = W ? AS.ridePlace(area, cfg.areas, cfg.fx_view || cfg.area_fx, cfg.profile_opts, shownAll, seenAll, W, H,
          (f, e) => AS.measureBox(probe, f, cfg.style, cfg.profile_opts, e, k, H, area.w * W)) : null;
        AS.drawLine(box, area, cfg.style, cfg.profile_opts, cfg.fx_view || cfg.area_fx, ev, cover, k, H,
          { W, H, ox, oy, areaW: area.w * W, areaH: area.h * H, noBoxes: !W, ride, whole });
      }

      invoke("get_config").then((c) => { cfg = c; AS.setLang(c.target_lang); draw(); });
      listen("config", (e) => { cfg = e.payload; AS.setLang(cfg.target_lang); draw(); });
      listen("geom", (e) => { geom = e.payload; draw(); });
      window.addEventListener("resize", draw);
      // fonts load asynchronously; redraw once they are ready so sizes are measured with the right font
      document.fonts.ready.then(draw);
      if (SCREEN) {
        invoke("get_screen").then((s) => { layout = s.layout; segments = s.reason || []; draw(); });
        // (a page gone for a moment and back — not read on one frame — stays up: see AS.STEADY)
        let pageGone = null;
        listen("screen", (e) => {
          clearTimeout(pageGone);
          if (e.payload || !layout || !AS.STEADY.on) {
            layout = e.payload; if (!layout) segments = []; draw();
            return;
          }
          pageGone = setTimeout(() => { layout = null; segments = []; draw(); }, AS.STEADY.holdMs);
        });
      }
      const MY_TEXT = SCREEN ? "__screen_reason" : AREA;
      let lineGone = null;
      if (PHONE) {
        invoke("get_phone").then((p) => { phone = p; draw(); }).catch(() => {});
        listen("phone", (e) => { phone = e.payload; draw(); });
        listen("phone-anchor", (e) => AS.phoneAnchor(e.payload));
      }
      listen("cover", (e) => {
        if (e.payload.cover) seenAll[e.payload.area] = e.payload.cover; else delete seenAll[e.payload.area];
        if (e.payload.area === AREA) cover = e.payload.cover || null;
        if (!SCREEN) draw();
      });
      listen("translation", (e) => {
        if (!e.payload.error) {
          if (e.payload.segments && e.payload.segments.length) shownAll[e.payload.area] = e.payload; else delete shownAll[e.payload.area];
          // (another area's line moves a riding translation)
          if (e.payload.area !== MY_TEXT && !SCREEN && cfg && AS.fxOf(cfg.fx_view || cfg.area_fx, AREA).ride) draw();
        }
        if (e.payload.area !== MY_TEXT || e.payload.error) return;
        // (a translation taken down and the same one back a moment later stays up, not blinking: every
        // area but the subtitles, whose lines leave with their English at once — see AS.STEADY)
        clearTimeout(lineGone);
        const empty = !(e.payload.segments && e.payload.segments.length);
        if (empty && segments.length && AS.STEADY.on && AREA !== "subtitles" && !SCREEN) {
          lineGone = setTimeout(() => { segments = []; draw(); }, AS.STEADY.holdMs);
          return;
        }
        segments = e.payload.segments;
        if (e.payload.line_h) lineH = e.payload.line_h;
        if (e.payload.text_box) textBox = e.payload.text_box;
        gameBox = e.payload.game_box || null;
        draw();
      });
    </script>
  </body>
</html>
