<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>Barqawi for OBS</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      /* OBS Browser Source: the page covers the game picture; only the Arabic is drawn */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #areas, #screen { position: fixed; inset: 0; }
      .band { position: absolute; }
    </style>
  </head>
  <body>
    <div id="areas"></div>
    <div id="screen"></div>
    <script src="common.js"></script>
    <script>
      // Same drawing as the overlay windows (common.js), but for the whole frame at once: every rect
      // is a fraction of the game picture, and the page is the game picture.
      const areasEl = document.getElementById("areas");
      const screenEl = document.getElementById("screen");
      let state = null;
      let lastText = "";
      let build = null; // the app's run this page's code came from

      function draw() {
        if (!state) return;
        const W = window.innerWidth, H = window.innerHeight;
        const k = H / 1080; // style sizes are for 1080p
        areasEl.innerHTML = "";
        const probe = document.createElement("div");
        areasEl.appendChild(probe);
        // Overlays switched off in the app: nothing on the stream either
        if (state.overlays === false) {
          screenEl.innerHTML = "";
          return;
        }
        if (!state.screen) {
          for (const a of state.areas) {
            const ev = state.shown[a.id];
            const cover = (state.covers || {})[a.id] || null;
            if (!a.enabled || ((!ev || !ev.segments || !ev.segments.length) && !cover)) continue;
            const px = { x: a.x * W, y: a.y * H, w: a.w * W, h: a.h * H };
            const r = AS.rectFor(a.placement, px, W, H, a);
            const band = document.createElement("div");
            band.className = "band";
            Object.assign(band.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
            const box = document.createElement("div");
            band.appendChild(box);
            areasEl.appendChild(band);
            AS.anchor(band, a.placement, a);
            // (the profile's look: over the game's lines on a black box, or the area's own placement;
            // and with it the black box alone over text not translated yet)
            // (riding above stacked lines: placed by the other areas' too)
            const ride = AS.ridePlace(a, state.areas, state.area_fx, state.profile_opts, state.shown || {}, state.covers || {}, W, H,
              (f, e) => AS.measureBox(probe, f, state.style, state.profile_opts, e, k, H, a.w * W));
            AS.drawLine(box, a, state.style, state.profile_opts, state.area_fx, ev, cover, k, H, { W, H, ox: r.x, oy: r.y, areaW: px.w, areaH: px.h, ride });
          }
        }
        AS.renderScreen(screenEl, state.screen, state.reason || [], state.profile_opts);
        // (GTA VI's phone held up: its Arabic drawn inside its screen, moved by the anchor)
        if (!state.screen && state.phone) {
          const ph = document.createElement("div");
          Object.assign(ph.style, { position: "absolute", left: "0", top: "0", width: W + "px", height: H + "px" });
          areasEl.appendChild(ph);
          AS.phoneAnchor(state.phone_anchor || null);
          AS.renderPhone(ph, state.phone);
        }
      }

      async function poll() {
        try {
          const text = await (await fetch("/state", { cache: "no-store" })).text();
          if (text !== lastText) {
            lastText = text;
            state = JSON.parse(text);
            AS.setLang(state.lang);
            // the app was restarted (maybe updated): load its current code
            if (build !== null && state.build !== build) { location.reload(); return; }
            build = state.build;
            draw();
          }
        } catch (e) {
          // the app is closed: show nothing, keep trying
          if (state) { state = null; lastText = ""; areasEl.innerHTML = ""; screenEl.innerHTML = ""; }
        }
        setTimeout(poll, 100);
      }
      window.addEventListener("resize", draw);
      document.fonts.ready.then(draw);
      poll();
    </script>
  </body>
</html>
