[package]
name = "vi-translator-xbox"
description = "Xbox Remote Play for VI Translator: Microsoft sign-in with a code, the account's consoles, and the console's stream over WebRTC (webrtc-rs), as xbox.com's player gets it"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# WebRTC in Rust (ICE, DTLS, SRTP, SCTP data channels, RTP): no browser and no native libwebrtc.
# 0.17 is the API the open-source XStreaming player streams from Xbox consoles with (0.20+ is a rewrite).
webrtc = "0.17.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
# the picture: H.264 decoded on the CPU (Cisco's OpenH264), as the PS5's is
openh264 = "0.9"
# the sound (Opus)
opus = "0.4"
# controllers in and the sound out, as for the PS5
sdl2 = { version = "0.39", features = ["bundled", "static-link"] }
